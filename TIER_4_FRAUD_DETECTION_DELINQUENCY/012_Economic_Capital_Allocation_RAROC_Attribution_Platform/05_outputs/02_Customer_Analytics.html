<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Analytics Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
        }
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        .container {
            max-width: 1400px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .search-box {
            background: white;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .search-box input {
            width: 100%;
            padding: 10px;
            font-size: 1em;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .table-container {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        th {
            background: #2c3e50;
            color: white;
            padding: 15px;
            text-align: left;
            font-weight: 600;
        }
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
        }
        tr:hover {
            background: #f8f9fa;
        }
        .risk-badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: 600;
            display: inline-block;
        }
        .risk-very-low { background: #d5f4e6; color: #27ae60; }
        .risk-low { background: #d6eaf8; color: #2980b9; }
        .risk-moderate { background: #fdebd0; color: #d68910; }
        .risk-high { background: #fadbd8; color: #cb4335; }
        .positive { color: #27ae60; font-weight: 600; }
        .negative { color: #cb4335; font-weight: 600; }
        .footer {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Customer Analytics Dashboard</h1>
        <p>Top 100 Customers by Exposure at Default</p>
    </div>

    <div class="container">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search by Customer ID..." onkeyup="filterTable()">
        </div>

        <div class="table-container">
            <table id="customerTable">
                <thead>
                    <tr>
                        <th>Customer ID</th>
                        <th>Risk Tier</th>
                        <th>Risk Score</th>
                        <th>EAD (Millions)</th>
                        <th>Current Price</th>
                        <th>Recommended Price</th>
                        <th>Price Change %</th>
                        <th>Recommendation</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>

        <div class="footer">
            <p>Top 100 customers represent the largest exposures in the portfolio</p>
        </div>
    </div>

        function getRiskClass(tier) {
            return 'risk-' + tier.toLowerCase().replace(/ /g, '-');
        }

        function populateTable() {
            const tableBody = document.getElementById('tableBody');
            tableBody.innerHTML = '';

            customers.forEach(row => {
                const tr = document.createElement('tr');
                const riskClass = getRiskClass(row.RISK_TIER);
                const recClass = row.pricing_recommendation === 'INCREASE' ? 'positive' : 'negative';

                tr.innerHTML = '<td>' + row.SK_ID_CURR + '</td>' +
                    '<td><span class="risk-badge ' + riskClass + '">' + row.RISK_TIER + '</span></td>' +
                    '<td>' + row.credit_risk_score.toFixed(2) + '</td>' +
                    '<td>' + (row.EAD_USD / 1000000).toFixed(1) + '</td>' +
                    '<td>' + row.current_price_rate.toFixed(4) + '</td>' +
                    '<td>' + row.price_recommended.toFixed(4) + '</td>' +
                    '<td class="' + recClass + '">' + row.price_change_pct.toFixed(2) + '%</td>' +
                    '<td class="' + recClass + '">' + row.pricing_recommendation + '</td>';
                tableBody.appendChild(tr);
            });
        }

        function filterTable() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                row.style.display = row.textContent.toLowerCase().includes(input) ? '' : 'none';
            });
        }

        populateTable();
    </script>
